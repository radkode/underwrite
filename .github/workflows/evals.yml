name: evals

on:
  pull_request:
    paths:
      - "skills/underwrite/SKILL.md"
      - "evals/**"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Each run spends model budget, so it waits for the owner to add the key; fork PRs never see it.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Without a model key the walk cannot run
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY is not set, so no eval walk ran"
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm install --global @anthropic-ai/claude-code@2.1.251 --no-audit --no-fund
      - if: env.ANTHROPIC_API_KEY != ''
        run: python3 evals/run.py --bare --max-budget-usd 3 --baseline evals/baseline.json
