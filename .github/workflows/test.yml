name: test

on:
  push:
    branches: [main]
  pull_request:

# Fork PRs already get a read-only token; this covers the push runs too, so a
# future workflow does not inherit write by default.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest and newest supported, since the scripts promise stdlib-only.
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  gateway-conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the pinned gateway image
        run: |
          docker build \
            --build-arg PYTHON_IMAGE=python:3.13-slim@sha256:7ce4b6dfe35e55397b7cda544f8a13f191b7ae28dc5aad71fe664dbc9bc2623f \
            --file gateway/Dockerfile \
            --tag underwrite-gateway:conformance \
            .
          echo "UNDERWRITE_LIVE_GATEWAY_IMAGE=$(docker image inspect --format='{{.Id}}' underwrite-gateway:conformance)" >> "$GITHUB_ENV"
          echo "UNDERWRITE_LIVE_GATEWAY_PLATFORM=${{ matrix.platform }}" >> "$GITHUB_ENV"
          echo "UNDERWRITE_LIVE_GATEWAY_DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
      - name: Exercise the privileged Linux boundary
        run: python -m unittest tests.test_gateway_live -v

  plugin-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install --global @anthropic-ai/claude-code@2.1.251 --no-audit --no-fund
      - run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate skills --strict
        env:
          DISABLE_AUTOUPDATER: "1"
